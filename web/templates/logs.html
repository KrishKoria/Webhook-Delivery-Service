<!DOCTYPE html>
<html>
  <head>
    <title>Delivery Logs - Webhook Service</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/ui/dashboard" class="navbar-brand">Webhook Service</a>
      <ul class="navbar-nav">
        <li><a href="/ui/dashboard">Dashboard</a></li>
        <li><a href="/ui/subscriptions" class="active">Subscriptions</a></li>
        <li><a href="/ui/backlog">Backlog</a></li>
        <li><a href="/ui/dlq">Dead Letter Queue</a></li>
        <li><a href="/ui/scheduled">Scheduled</a></li>
      </ul>
    </nav>

    <div class="container">
      <div class="page-header">
        <h1>Delivery Logs</h1>
        <p class="subtitle">Subscription: <code>{{.SubscriptionID}}</code></p>
      </div>

      <div class="action-bar">
        <a href="/ui/subscriptions" class="btn btn-secondary"
          >← Back to Subscriptions</a
        >
        <span class="status-indicator" id="status-indicator">
          <span class="pulse"></span> Live updating
        </span>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Recent Delivery Logs</h3>
        </div>
        <div class="card-body">
          <table class="table">
            <thead>
              <tr>
                <th>Task ID</th>
                <th>Status</th>
                <th>Timestamp</th>
                <th>Attempt</th>
                <th>Outcome</th>
                <th>HTTP Status</th>
                <th>Error</th>
              </tr>
            </thead>
            <tbody id="logs-body">
              <!-- Logs will be inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      function getOutcomeBadge(outcome) {
        const badgeClass =
          {
            delivered: "badge-success",
            failed: "badge-danger",
            retrying: "badge-warning",
            pending: "badge-info",
          }[outcome?.toLowerCase()] || "badge-secondary";
        return `<span class="badge ${badgeClass}">${outcome || "-"}</span>`;
      }

      function getStatusBadge(status) {
        const badgeClass =
          {
            completed: "badge-success",
            failed: "badge-danger",
            retrying: "badge-warning",
            pending: "badge-info",
            claimed: "badge-primary",
          }[status?.toLowerCase()] || "badge-secondary";
        return `<span class="badge ${badgeClass}">${status || "-"}</span>`;
      }

      function fetchLogs() {
        fetch("/api/subscriptions/{{.SubscriptionID}}/logs")
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then((logs) => {
            const tbody = document.getElementById("logs-body");
            tbody.innerHTML = "";
            if (!logs || logs.length === 0) {
              const tr = document.createElement("tr");
              tr.innerHTML =
                '<td colspan="7" class="text-center text-muted">No delivery logs found for this subscription.</td>';
              tbody.appendChild(tr);
              return;
            }
            logs.forEach((log) => {
              const tr = document.createElement("tr");
              const timestamp = new Date(log.Timestamp).toLocaleString();
              const status =
                log.TaskStatus && log.TaskStatus.Valid
                  ? log.TaskStatus.String
                  : "-";
              const httpStatus =
                log.HttpStatus && log.HttpStatus.Valid
                  ? log.HttpStatus.Int64
                  : "-";
              const errorDetails =
                log.ErrorDetails && log.ErrorDetails.Valid
                  ? log.ErrorDetails.String
                  : "-";

              tr.innerHTML = `
                <td><code>${log.DeliveryTaskID}</code></td>
                <td>${getStatusBadge(status)}</td>
                <td>${timestamp}</td>
                <td>${log.AttemptNumber}</td>
                <td>${getOutcomeBadge(log.Outcome)}</td>
                <td>${httpStatus}</td>
                <td class="text-muted">${errorDetails}</td>
              `;
              tbody.appendChild(tr);
            });
          })
          .catch((error) => {
            console.error("Error fetching logs:", error);
            const tbody = document.getElementById("logs-body");
            tbody.innerHTML = "";
            const tr = document.createElement("tr");
            tr.innerHTML =
              '<td colspan="7" class="text-center text-danger">Error fetching logs. Please try again later.</td>';
            tbody.appendChild(tr);
          });
      }

      fetchLogs();
      setInterval(fetchLogs, 2000);
    </script>
  </body>
</html>
