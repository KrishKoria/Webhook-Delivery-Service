services:
  app:
    build: .
    container_name: webhook-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Overrides REDIS_URL from .env to use the bundled Redis.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    container_name: webhook-redis
    # Not published to the host; only the app container can reach it.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
